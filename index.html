<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Apex Athlete</title>
<meta name="theme-color" content="#F2F5F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Apex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width app column, sticky header, fixed bottom tab bar; scoreboard numerals over a chalk-white ground */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#F7F9F8; --ink:#14212B; --muted:#5D6A72; --line:#DCE3E0;
  --accent:#1F4FE0; --accent-ink:#FFFFFF; --accent-soft:#E7EDFD;
  --good:#1D8657; --good-soft:#E3F3EB; --warn:#B86E00; --warn-soft:#FBF0DD; --pb:#A86A00; --pb-soft:#FCF1D9; --bad:#C2362B;
  --shadow:0 1px 2px rgba(20,33,43,.06),0 4px 14px rgba(20,33,43,.05);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1418; --surface:#162027; --surface-2:#1B262E; --ink:#E7EDEF; --muted:#94A2AA; --line:#27343C;
  --accent:#7392FF; --accent-ink:#0B1230; --accent-soft:#1C2748;
  --good:#4CC28D; --good-soft:#153126; --warn:#E8A646; --warn-soft:#33270F; --pb:#E6B450; --pb-soft:#30270F; --bad:#F07067;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1418; --surface:#162027; --surface-2:#1B262E; --ink:#E7EDEF; --muted:#94A2AA; --line:#27343C;
  --accent:#7392FF; --accent-ink:#0B1230; --accent-soft:#1C2748;
  --good:#4CC28D; --good-soft:#153126; --warn:#E8A646; --warn-soft:#33270F; --pb:#E6B450; --pb-soft:#30270F; --bad:#F07067;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{max-width:460px;margin:0 auto;min-height:100%;padding-inline:16px;padding-block:0 120px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:calc(14px + env(safe-area-inset-top,0px)) 10px}
.brand{white-space:nowrap;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.brand span{color:var(--accent)}
.avatar{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center}
.aion{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 8px;white-space:nowrap;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.aion.on{background:var(--good-soft);color:var(--good);border-color:transparent}

h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:6px 0 2px;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:.02em;margin:0;text-transform:uppercase}
h3{font-size:15px;font-weight:700;margin:0}
.sub{color:var(--muted);margin:0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.section{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.num{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.tab{font-variant-numeric:tabular-nums}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
button.card{text-align:left;width:100%;color:inherit}
.card.hero{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card.hero .sub,.card.hero .eyebrow{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.card.soft{background:var(--accent-soft);border-color:transparent;box-shadow:none}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding-block:11px;border-top:1px solid var(--line)}
.li:first-child{border-top:none;padding-top:2px}
.li:last-child{padding-bottom:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.card.hero .btn.primary{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.card.hero .btn.ghost{color:inherit;border-color:color-mix(in srgb,var(--bg) 45%,transparent)}
.icon-btn{width:32px;height:32px;flex:none;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-weight:700;padding:0}
.icon-btn.xs{width:26px;height:26px;font-size:12px}

.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;white-space:nowrap;border:none;background:none;border-radius:8px;padding:7px 10px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.hscroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.hscroll::-webkit-scrollbar{display:none}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.pb{background:var(--pb-soft);color:var(--pb);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}

.bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar.good i{background:var(--good)}

.check{width:24px;height:24px;flex:none;border-radius:7px;border:1.5px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:transparent;font-size:14px;font-weight:800;padding:0}
.check.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.check.auto{background:var(--good-soft);border-color:var(--good);color:var(--good)}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 2px;text-align:center;display:flex;flex-direction:column;gap:3px;align-items:center;min-width:0}
.day b{font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.day small{font-size:10px;color:var(--muted);line-height:1.1;overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap;padding-inline:2px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dot.lift{background:var(--accent)} .dot.sport{background:var(--ink)} .dot.rest{background:var(--line)} .dot.cond{background:var(--warn)}

.belt{height:14px;border-radius:3px;border:1px solid var(--line);position:relative;flex:none;display:inline-block}
.belt.tip::after{content:"";position:absolute;right:14%;top:-1px;bottom:-1px;width:22%;background:#16181A}
.belt.tip.blackbelt::after{background:#B3261E}
.stripes{display:flex;gap:2px;position:absolute;right:calc(14% + 3px);top:2px;bottom:2px;z-index:1}
.stripes i{width:3px;background:#FFFFFF;border-radius:1px}
.lvmark{width:26px;height:26px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-family:var(--display);font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:15px}

.road{display:flex;flex-direction:column}
.rstep{display:grid;grid-template-columns:22px 1fr;gap:12px;position:relative;padding-bottom:16px}
.rstep:last-child{padding-bottom:0}
.rstep::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line)}
.rstep:last-child::before{display:none}
.rnode{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);z-index:1}
.rstep.done .rnode{background:var(--good);border-color:var(--good)}
.rstep.now .rnode{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}

.lvl{border:none;border-radius:999px;font-size:12px;font-weight:700;padding:4px 10px;white-space:nowrap}
.lvl-0{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.lvl-1{background:var(--warn-soft);color:var(--warn)}
.lvl-2{background:var(--good-soft);color:var(--good)}

.setgrid{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 34px;gap:8px;align-items:center}
.setgrid .h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.setgrid .done-row{opacity:.55}
.inp{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:8px 10px;font-variant-numeric:tabular-nums}
.inp:focus{outline:none;border-color:var(--accent);background:var(--surface)}
textarea.inp{resize:vertical;line-height:1.45}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid > *{min-width:0}

.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px;text-align:left;display:flex;align-items:center;gap:8px;color:inherit}
.opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts.three{grid-template-columns:repeat(3,1fr)}
.optrow{display:flex;gap:6px;flex-wrap:wrap}
.optrow .opt{padding:7px 12px;font-size:13px;border-radius:999px}

.arch{display:flex;flex-direction:column;gap:4px;padding:12px;min-height:96px}
.arch .mono{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:460px;margin:0 auto;display:grid}
.nav button{background:none;border:none;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--accent)}
.fab{position:fixed;z-index:11;right:max(16px,calc(50% - 214px));bottom:calc(74px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border:none;border-radius:999px;padding:11px 16px;font-weight:700;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.18);display:flex;gap:7px;align-items:center}

.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,16,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:460px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding-inline:16px;padding-block:14px calc(20px + env(safe-area-inset-bottom,0px))}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.full{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto}
.full .app{padding-bottom:150px}

.timer{position:fixed;z-index:35;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--ink);color:var(--bg)}
.timer-in{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:12px;display:flex;align-items:center;gap:12px}
.timer .big{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;min-width:92px}
.timer .btn{background:transparent;color:inherit;border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.timer .tbar{position:absolute;left:0;top:0;height:3px;background:var(--accent);transition:width 1s linear}

.aion{cursor:pointer}
.keybox{display:flex;gap:8px}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:90%}
.msg{padding:10px 12px;border-radius:12px;max-width:88%;font-size:14px;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prose{white-space:pre-wrap;font-size:14px}
.think{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:sp 0.9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.stepdots{display:flex;gap:4px}
.stepdots i{height:4px;flex:1;border-radius:9px;background:var(--line)}
.stepdots i.on{background:var(--accent)}
svg text{fill:var(--muted);font-family:var(--body);font-size:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
table.ex{width:100%;border-collapse:collapse;font-size:13px}
table.ex td{padding:7px 4px;border-top:1px solid var(--line);vertical-align:top}
table.ex tr:first-child td{border-top:none}
@media (prefers-reduced-motion: reduce){.spin{animation:none}.bar i,.timer .tbar{transition:none}}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
html{-webkit-text-size-adjust:100%}
body{margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="nav"><div class="nav-in" id="nav"></div></nav>
<button class="fab" id="fab" data-act="coach" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3l2.2 5.6L20 11l-5.8 2.4L12 19l-2.2-5.6L4 11l5.8-2.4z"/></svg>Coach</button>
<div id="full"></div>
<div id="timer"></div>
<div id="layer"></div>

<script>
/* ================= DATA CATALOGUES ================= */
const BELTCOL={White:"#F4F4F2",Yellow:"#F2C94C",Orange:"#E8833A",Green:"#3C9A5F",Blue:"#1F5FBF",Purple:"#6B3FA0",Brown:"#6E4A2E",Black:"#16181A",Red:"#C0392B"};
const GROUPS={
 combat:{label:"Combat sports",levels:["Learning","Landing in drills","Reliable in sparring"],skillWord:"Arsenal",live:"Sparring",fields:["mins","live","worked","notes"],types:["Class","Sparring","Private","Competition"]},
 endurance:{label:"Endurance",levels:["Building up","Comfortable","Race-ready"],skillWord:"Skills",fields:["dist","mins","rpe","notes"],types:["Easy","Tempo","Intervals","Long","Race"]},
 strength:{label:"Strength sports",levels:["Learning","Solid in training","Competition-ready"],skillWord:"Skills",fields:["mins","top","notes"],types:["Training","Technique","Test day","Competition"]},
 climb:{label:"Climbing",levels:["Projecting","Sent it","Reliable"],skillWord:"Techniques",fields:["mins","grade","notes"],types:["Bouldering","Lead","Top rope","Board session"]},
 team:{label:"Team & racket",levels:["Learning","Good in training","Reliable in matches"],skillWord:"Skills",fields:["mins","result","worked","notes"],types:["Training","Match","Coaching","Casual"]},
 board:{label:"Board & snow",levels:["Learning","Landing it","Reliable"],skillWord:"Skills",fields:["mins","worked","notes"],types:["Session","Lesson","Trip day"]},
 movement:{label:"Movement",levels:["Working on it","Can hold it","Owned"],skillWord:"Skills",fields:["mins","worked","notes"],types:["Class","Home practice","Workshop"]}
};
// D(id,name,group,kind,steps,skills,extra) — skills "Cat:a|b;Cat2:c"
const SPORTS=[];
function D(id,n,g,kind,steps,skills,x){const sk=[];skills.split(";").forEach(p=>{const[c,l]=p.split(":");l.split("|").forEach(s=>sk.push([s.trim(),c.trim()]))});SPORTS.push(Object.assign({id,n,g,kind,steps:steps.split("|"),skills:sk},x||{}))}
D("bjj","Brazilian Jiu-Jitsu","combat","belts","White|Blue|Purple|Brown|Black","Chokes:Rear naked choke|Triangle|Guillotine|Darce|Anaconda|Arm triangle|Bow and arrow|Ezekiel;Arm locks:Armbar|Kimura|Americana|Omoplata;Leg locks:Straight ankle lock|Kneebar|Inside heel hook|Toe hold;Escapes:Trap and roll|Elbow-knee escape|Side control frame escape|Underhook to knees|Back escape;Guard:Closed guard|Guard retention|Butterfly guard|De la Riva|Half guard|Single leg X;Sweeps:Scissor sweep|Hip bump|Butterfly sweep|Flower sweep;Passes:Toreando|Knee cut|Over-under|Leg drag|Body lock pass;Back:Back control|Back take from turtle|Seatbelt;Takedowns:Double leg|Single leg|Snap-down|Arm drag",{levels:["Learning","Hit it in drilling","Reliable in rolling"],live:"Rolling",types:["Class","Open mat","Private","Competition"],stripes:true,short:"BJJ",yrs:[0,2,4.5,6.5,9]});
D("judo","Judo","combat","belts","White|Yellow|Orange|Green|Blue|Brown|Black","Throws:O-soto-gari|Seoi-nage|Uchi-mata|O-uchi-gari|Ko-uchi-gari|Harai-goshi|Tai-otoshi|De-ashi-barai|Tomoe-nage;Groundwork:Kesa-gatame|Yoko-shiho-gatame|Juji-gatame|Okuri-eri-jime|Turnovers;Fundamentals:Ukemi (breakfalls)|Kumikata (gripping)|Kuzushi (off-balancing)",{live:"Randori"});
D("wrestling","Wrestling","combat","levels","Beginner|Club competitor|Regional|National|International","Takedowns:Double leg|Single leg|High crotch|Ankle pick|Snap-down|Duck under|Arm drag|Body lock;Defence:Sprawl|Whizzer|Hand fighting|Downblock;Top:Half nelson|Tilt|Leg ride;Bottom:Stand-up|Sit-out|Switch|Granby roll",{live:"Live wrestling"});
D("boxing","Boxing","combat","levels","Novice|First bout|Carded amateur|Experienced amateur|Elite / pro","Punches:Jab|Cross|Lead hook|Rear hook|Uppercuts|Body shots;Defence:Slip|Roll|Parry|Shell guard|Pull counter;Footwork:Pivot|Angles|Cutting the ring|In and out;Combos:1-2|1-2-3|Jab to the body|Double jab");
D("muaythai","Muay Thai","combat","levels","Beginner|Intermediate|Interclub|Fighter (C/B class)|A class / pro","Strikes:Teep|Roundhouse kick|Low kick|Knee|Elbow|Jab-cross;Clinch:Plum|Clinch knees|Dumps and sweeps|Off-balancing;Defence:Check|Catch and counter|Long guard|Lean back");

async function claudeCall(input,{onText,signal,modelTier,maxTokens}={}){
 if(!aiOn())throw{code:"no_key",message:"Add your Anthropic API key in Settings to use Claude."};
 const msgs=[];(typeof input==="string"?[{role:"user",content:input}]:input).forEach(m=>{const l=msgs[msgs.length-1];if(l&&l.role===m.role)l.content+="\n\n"+m.content;else msgs.push({role:m.role,content:String(m.content)})});
 const model=modelTier==="quick"?"claude-haiku-4-5-20251001":(SET.model||"claude-sonnet-5-5");
 let r;
 try{r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal,headers:{"content-type":"application/json","x-api-key":SET.apiKey.trim(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model,max_tokens:maxTokens||(modelTier==="quick"?1200:12000),stream:true,system:SYS,messages:msgs})})}
 catch(e){if(e&&e.name==="AbortError")throw{code:"cancelled"};throw{code:"network",message:"Couldn't reach Claude. Check your connection and try again."}}
 if(!r.ok){let m="";try{const j=await r.json();m=(j.error&&j.error.message)||""}catch(e){}throw{code:"api",status:r.status,message:apiMsg(r.status,m)}}
 const rd=r.body.getReader(),dec=new TextDecoder();let buf="",text="",stop="";
 try{for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
  while((i=buf.indexOf("\n"))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line.startsWith("data:"))continue;let ev;try{ev=JSON.parse(line.slice(5))}catch(e){continue}
   if(ev.type==="content_block_delta"&&ev.delta&&ev.delta.type==="text_delta"){text+=ev.delta.text;if(onText)try{onText({text,delta:ev.delta.text})}catch(e){}}
   else if(ev.type==="message_delta"&&ev.delta&&ev.delta.stop_reason)stop=ev.delta.stop_reason;
   else if(ev.type==="error")throw{code:"api",message:apiMsg(529,(ev.error&&ev.error.message)||""),text}}}}
 catch(e){if(e&&e.name==="AbortError")throw{code:"cancelled",text};if(e&&e.code)throw e;throw{code:"network",message:"The connection dropped. Try again.",text}}

 return{text,truncated:stop==="max_tokens"};
}

const RMS=[1,2,3,5,8,10];
const bestOf=h=>{let b=null;const pool=h.some(x=>x.reps<=12)?h.filter(x=>x.reps<=12):h;pool.forEach(x=>{const e=e1rm(x.kg,x.reps);if(!b||e>b.e)b={...x,e}});return b};

const heaviestOf=h=>h.reduce((a,x)=>!a||x.kg>a.kg||(x.kg===a.kg&&x.reps>a.reps)?x:a,null);
const repMaxOf=(h,N)=>h.filter(x=>x.reps>=N).reduce((a,x)=>!a||x.kg>a.kg?x:a,null);
const testedOf=h=>h.filter(x=>x.t&&x.reps===1).reduce((a,x)=>!a||x.kg>a.kg?x:a,null);
const rnd25=v=>Math.round(v/2.5)*2.5;
const byDate=h=>{const m={};h.forEach(x=>{const e=e1rm(x.kg,x.reps);if(!m[x.d]||e>m[x.d].e)m[x.d]={...x,e}});return Object.values(m).sort((a,b)=>a.d<b.d?-1:1)};
/* which PB types does a set beat, against earlier entries? */
function pbKinds(before,kg,reps){
 if(!before.length)return["First entry"];
 const k=[];const b=bestOf(before),hv=heaviestOf(before);
 if(reps<=12&&(!b||e1rm(kg,reps)>b.e+0.01))k.push("Est. 1RM");
 if(kg>hv.kg)k.push("Heaviest lift");
 const rms=RMS.filter(N=>reps>=N&&N>1).filter(N=>{const r=repMaxOf(before,N);return !r||kg>r.kg});
 rms.forEach(N=>k.push(N+"RM"));
 return k;
}

function templateGoal(text,parts){
 const r={title:text.length>48?text.slice(0,45)+"…":text,type:"Goal",summary:"An example structure. With Claude on, every part is written from your data.",milestones:[{when:"Week 1",what:"Baseline tests and first sessions"},{when:"Week 4",what:"First check-in: adjust load and food"},{when:"Week 8",what:"Re-test benchmarks"},{when:"Week 12",what:"Goal attempt or next block"}],first_week:["Log every session this week","Hit your protein target 5 of 7 days","Weigh in 3 mornings"]};
 if(parts.includes("training"))r.training=progToJSON(templateProgramme({name:"Goal",pillars:["Strength","Conditioning","Skill"],cat:""},{days:S.profile.days,len:S.profile.len,equip:S.profile.equip},S));
 if(parts.includes("nutrition"))r.nutrition={train:S.targets.train,rest:S.targets.rest,notes:["Protein at every meal","Carbs before and after training","3 L of water daily"]};
 if(parts.includes("supps"))r.supplements=[{n:"Creatine monohydrate",dose:"5 g",time:"Any time",why:"Best-evidenced supplement for strength and power."},{n:"Vitamin D3",dose:"2,000 IU",time:"Morning",why:"Most UK adults are low in winter."}];
 if(parts.includes("recovery"))r.recovery=["7–9 hours of sleep, same wake time daily","10 min mobility after training","One full rest day a week"];
 if(parts.includes("sport")&&sportIds().length){const id=sportIds()[0];const weak=S.sports[id].skills.filter(k=>k.l===0).map(k=>k.n);r.sport={sport:sportDef(id).n,focus:[{n:weak[0]||"Fundamentals",why:"Weakest area in your skills log",tech:weak.slice(0,2)}]}}
 return r;
}
function applyPart(k,r,goal){
 if(k==="training"&&r.training){const P=progFromJSON(r.training,r.training.name);P.source="Goal plan";S.programme=P;toast("Programme updated")}
 if(k==="nutrition"&&r.nutrition){const n=r.nutrition;["train","rest"].forEach(x=>{if(n[x]&&+n[x].kcal)S.targets[x]={kcal:+n[x].kcal,p:+n[x].p,c:+n[x].c,f:+n[x].f}});toast("Targets updated")}
 if(k==="supps"&&r.supplements){let a=0;r.supplements.forEach(s=>{if(!S.supps.some(x=>x.n.toLowerCase()===String(s.n).toLowerCase())){S.supps.push({n:String(s.n),dose:String(s.dose||""),time:["Morning","Any time","With food","Pre-training","Evening"].includes(s.time)?s.time:"Any time",why:String(s.why||"")});a++}});toast(a?`${a} added to your stack`:"Already in your stack")}
 if(k==="sport"&&r.sport){const nm=String(r.sport.sport||"").toLowerCase();const id=sportIds().find(i=>nm.includes(sportDef(i).n.toLowerCase().split(" ")[0])||nm.includes(i))||sportIds()[0];if(id){(r.sport.focus||[]).forEach(f=>S.sports[id].focus.unshift({n:String(f.n),why:String(f.why||""),tech:(f.tech||[]).map(String),start:TD}));toast("Focuses added")}}
 if(goal){goal.applied=goal.applied||{};goal.applied[k]=true}
 save();render();
}

 <p class="tiny muted" style="margin:0">Apple Health / Google Fit would fill sleep, resting HR and steps automatically in the real app.</p>`;

function wChart(pts){
 const W=340,H=150,L=34,R=10,T=10,B=22;const ks=pts.map(p=>p.kg);
 const mn=Math.floor(Math.min(...ks)-0.3),mx=Math.ceil(Math.max(...ks)+0.3);
 const x=i=>L+i/(pts.length-1)*(W-L-R),y=v=>T+(mx-v)/(mx-mn||1)*(H-T-B);
 const avg=pts.map((p,i)=>{const s=pts.slice(Math.max(0,i-2),i+1);return s.reduce((a,b)=>a+b.kg,0)/s.length});
 const step=mx-mn>6?2:1;const ticks=[];for(let v=mn;v<=mx;v+=step)ticks.push(v);
 return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Weight trend">
  ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`).join("")}
  <path d="M${x(0)},${y(avg[0])} ${avg.map((v,i)=>`L${x(i)},${y(v)}`).join(" ")} L${x(avg.length-1)},${H-B} L${x(0)},${H-B}Z" fill="var(--accent-soft)" stroke="none"/>
  <polyline points="${avg.map((v,i)=>x(i)+","+y(v)).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
  ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.kg)}" r="2" fill="var(--muted)"/>`).join("")}
  <circle cx="${x(pts.length-1)}" cy="${y(avg[avg.length-1])}" r="4" fill="var(--accent)"/>
  <text x="${L}" y="${H-6}">${fmtD(pts[0].d)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${fmtD(pts[pts.length-1].d)}</text></svg></div>`;
}

 if(st===3){const q=OB.q.toLowerCase();
  body=`<h1>Any sports or athletic hobbies?</h1><p class="sub">Pick as many as you like. Each gets its own roadmap, skills log and session tracking. Or skip if you just want to train.</p>

 if(st===4){body=`<h1>Where are you at?</h1><p class="sub">So your roadmap starts in the right place.</p>`+(OB.sportsSel.length?OB.sportsSel.map(id=>{const d=sportDef(id),lv=OB.sportLv[id]||(OB.sportLv[id]={step:0,sub:0,start:""});return `<div class="card stack" style="gap:10px"><h3>${esc(d.n)}</h3><div class="optrow">${d.steps.map((s,i)=>`<button type="button" class="opt ${+lv.step===i?"on":""}" data-act="oblv" data-id="${id}" data-v="${i}">${d.kind==="belts"?beltSwatch(d,i,0,22):""}${esc(s)}</button>`).join("")}</div>${d.stripes?`<div class="f"><span class="eyebrow">Stripes</span><div class="optrow">${[0,1,2,3,4].map(n=>`<button type="button" class="opt ${+lv.sub===n?"on":""}" data-act="obsub" data-id="${id}" data-v="${n}">${n}</button>`).join("")}</div></div>`:""}${fieldH("obst_"+id,"Started (roughly)",`type="month" data-obst="${id}"`,lv.start?lv.start.slice(0,7):"")}</div>`}).join(""):`<div class="card small muted">No sports picked. Skip ahead.</div>`)}
 if(st===5)body=`<h1>Food & supplements</h1><div class="f"><span class="eyebrow">Dietary needs</span><div class="optrow">${["Vegetarian","Vegan","Pescatarian","Gluten-free","Dairy-free","Halal","No pork","Nut allergy"].map(v=>opt("diet",v,v,1)).join("")}</div></div>
  <div class="f"><span class="eyebrow">Supplements you already take</span><div class="optrow">${SUPP_LIB.map(v=>opt("supps",v,v,1)).join("")}</div></div>`;
 if(st===6)body=`<h1>Anything specific?</h1><p class="sub">Optional. Describe a goal in your own words and Claude can build a plan straight after sign-up.</p>
  <label class="f" for="ob_goal">Your goal<textarea class="inp" id="ob_goal" data-ob="goalText" rows="4" placeholder="e.g. Get my first pull-up and run a sub-25 5K by summer">${esc(OB.goalText)}</textarea></label>`;

 openFull(`<div class="app stack"><div class="top">${OB.first?`<span class="brand">Apex <span>Athlete</span></span>`:`<button class="btn sm ghost" data-act="obclose" type="button">Close</button>`}<span class="eyebrow">Step ${st+1} of ${OB_STEPS.length}</span>${OB.first?"":`<span style="width:52px"></span>`}</div>${dots}${body}

function obSportList(q){
 return Object.entries(GROUPS).map(([g,G])=>{const xs=SPORTS.filter(s=>s.g===g&&(!q||s.n.toLowerCase().includes(q)));if(!xs.length)return"";return `<div class="stack" style="gap:6px"><span class="eyebrow">${esc(G.label)}</span><div class="optrow">${xs.map(s=>`<button type="button" class="opt ${OB.sportsSel.includes(s.id)?"on":""}" data-act="obsport" data-id="${s.id}">${esc(s.n)}</button>`).join("")}</div></div>`}).join("")||`<div class="small muted">No match. The real app lets you add a custom sport.</div>`;
}
function finishOB(){
 const p=Object.assign({},OB);p.sportLv={};p.sportsSel.forEach(id=>{const lv=OB.sportLv[id]||{};p.sportLv[id]={step:lv.step||0,sub:lv.sub||0,start:lv.start||TD}});
 S=blankFrom(p);save();OB=null;closeFull();UI.tab="today";UI.sport=null;render();
 toast(`Welcome, ${S.profile.name}`);
 if(p.goalText.trim())setTimeout(()=>goalRun(p.goalText.trim(),["training","nutrition"],"",null),300);

function closeSheet(){$("#layer").innerHTML=""}
function openFull(html){$("#full").innerHTML=`<div class="full" id="fullin">${html}</div>`;document.body.style.overflow="hidden"}
function closeFull(){$("#full").innerHTML="";document.body.style.overflow="";if(AICTL){try{AICTL.abort()}catch(e){}AICTL=null}}
function formSheet(title,form,fields,submit){sheet(`<form class="stack" data-form="${form}"><h2>${esc(title)}</h2>${fields}<div class="row"><button class="btn ghost grow" data-act="close" type="button">Cancel</button><button class="btn primary grow" type="submit">${submit||"Save"}</button></div></form>`)}
function fieldH(id,label,attrs="",val=""){return `<label class="f" for="${id}">${label}<input class="inp" id="${id}" name="${id}" ${attrs} value="${esc(val)}"></label>`}
function selectH(id,label,opts,val){return `<label class="f" for="${id}">${label}<select class="inp" id="${id}" name="${id}">${opts.map(o=>`<option ${o===val?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`}
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2300)}

/* ================= coach ================= */
let CHAT=[];
const SCRIPT=[[/plateau|stuck|stall/i,()=>"Your main lifts are still climbing. Bench is the slowest: the last jump cost a rep. Repeat the weight next week and chase clean reps before adding load."],[/eat|food|carb|protein|before|after/i,()=>`Get 60–80 g carbs 2–3 hours before hard sessions and 40 g protein afterwards. You're at ${totals().p} g protein today against ${tgt().p} g.`],[/weight|cut|kg|comp/i,()=>`You're ${latestW()?latestW().kg:"?"} kg with a ${r1(avgW(7))} kg weekly average. Walk around within 1 kg of your class and avoid water cuts at that margin.`],[/work on|focus|next|weak/i,()=>{const id=sportIds()[0];if(!id)return"Your history shows lower body getting most volume. Add a second pulling day.";const low=S.sports[id].skills.filter(a=>a.l===0).map(a=>a.n);return `In ${sportDef(id).n}, still at the first level: ${low.slice(0,4).join(", ")||"nothing"}. Pick one and drill it 10 minutes before every session.`}]];
function vCoach(){
 return `<div class="stack"><div class="between"><h2>Coach</h2><button class="btn sm ghost" data-act="close" type="button">Close</button></div>
  <p class="tiny muted" style="margin:0">${aiOn()?"Claude sees your training, food, body and sport logs.":"Add your API key in Settings for real coaching. Until then, replies are scripted."}</p>
  <div class="stack" id="chatlog" style="gap:8px">${(CHAT.length?CHAT:[{ai:1,t:"Ask me about your programme, a plateau, food around training or what to work on next."}]).map(m=>`<div class="msg ${m.ai?"ai":"me"}">${esc(m.t)}</div>`).join("")}</div>
  <div class="chips">${["What should I work on next?","Am I plateauing?","What should I eat before training?","Swap Friday's session for something shorter"].map(q=>`<button type="button" class="chip" data-act="ask" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>
  <form class="row" data-form="chat"><input class="inp grow" id="chatq" name="chatq" placeholder="Ask anything about your training" autocomplete="off"><button class="btn primary" type="submit">Send</button></form></div>`;
}
async function ask(q){
 if(!q.trim())return;CHAT.push({t:q});
 if(!aiOn()){const hit=SCRIPT.find(([re])=>re.test(q));CHAT.push({ai:1,t:hit?hit[1]():"Add your API key in Settings to ask anything. Offline I can answer about plateaus, food, weight or what to work on."});sheet(vCoach());return}
 CHAT.push({ai:1,t:"Thinking…"});sheet(vCoach());const bubble=$("#chatlog").lastElementChild;bubble.scrollIntoView({block:"nearest"});
 const turns=[{role:"user",content:`You are the in-app coach for a fitness app. Be specific, warm and brief (2–5 sentences, short lists if useful). Use this athlete data:\n${ctx()}\nProgramme days: ${S.programme?ORDER.map(i=>{const d=S.programme.days[i];return DOW[i]+": "+d.title}).join("; "):"none"}.`},...CHAT.slice(0,-1).slice(-10).map(m=>({role:m.ai?"assistant":"user",content:m.t}))];
 while(turns.length>1&&turns[1].role==="assistant")turns.splice(1,1);
 try{const {text}=await SAMPLE(turns,{cache:false,modelTier:"quick",onText:({text})=>{bubble.textContent=text}});CHAT[CHAT.length-1].t=text}
 catch(e){CHAT[CHAT.length-1].t=e&&e.text?e.text:((e&&e.message)||"Couldn't reach Claude. Try again.");bubble.textContent=CHAT[CHAT.length-1].t}
}

const NAVS={today:["Today",'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'],train:["Train",'<path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/>'],fuel:["Fuel",'<path d="M12 21c4-2 7-6 7-11a7 7 0 0 0-14 0c0 5 3 9 7 11z"/><path d="M12 8v6"/>'],sport:["Sport",'<circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/>'],progress:["Progress",'<path d="M4 18l5-6 4 3 7-9"/><path d="M15 6h5v5"/>']};

 const tabs=["today","train","fuel",...(sportIds().length?["sport"]:[]),"progress"];
 if(!tabs.includes(UI.tab))UI.tab="today";
 $("#nav").style.gridTemplateColumns=`repeat(${tabs.length},1fr)`;
 $("#nav").innerHTML=tabs.map(k=>`<button type="button" class="${UI.tab===k?"on":""}" data-act="nav" data-tab="${k}" aria-label="${NAVS[k][0]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${NAVS[k][1]}</svg>${NAVS[k][0]}</button>`).join("");
 const v={today:vToday,train:vTrain,fuel:vFuel,sport:vSport,progress:vProgress}[UI.tab]();
 $("#app").innerHTML=`<div class="top"><div class="brand">Apex <span>Athlete</span></div><div class="row"><button type="button" class="aion ${aiOn()?"on":""}" data-act="settings">${aiOn()?"✦ Claude on":"Add Claude key"}</button><button class="avatar" data-act="profile" type="button" aria-label="Profile">${esc((S.profile.name||"A")[0].toUpperCase())}</button></div></div>${v}`;
 try{localStorage.setItem(KEY+":ui",JSON.stringify({tab:UI.tab,train:UI.train,fuel:UI.fuel,prog:UI.prog,sport:UI.sport,sportView:UI.sportView,tlaCat:UI.tlaCat}))}catch(e){}

  <div class="card stack" style="gap:8px"><div class="between"><h3>Sports & hobbies</h3><button class="btn sm" data-act="addsport" type="button">+ Add</button></div>${ids.length?ids.map(id=>`<div class="row"><span class="grow small"><b>${esc(sportDef(id).n)}</b> · ${esc(sportDef(id).steps[S.sports[id].step])}</span><button class="btn sm ghost" data-act="rmsport" data-id="${id}" type="button">Remove</button></div>`).join(""):`<p class="small muted" style="margin:0">None. Sport tracking stays hidden until you add one.</p>`}</div>

 return `<div class="stack"><div class="between"><h2>Settings</h2><button class="btn sm ghost" data-act="close" type="button">Close</button></div>
 <div class="card stack" style="gap:10px"><div class="between"><h3>Claude</h3><span class="pill ${aiOn()?"good":""}">${aiOn()?"Connected":"Not set up"}</span></div>

 <div class="card stack" style="gap:8px"><h3>Appearance</h3><div class="optrow">${[["light","Light"],["auto","Match phone"],["dark","Dark"]].map(([v,l])=>`<button type="button" class="opt ${SET.theme===v?"on":""}" data-act="settheme" data-v="${v}">${l}</button>`).join("")}</div></div>
 <div class="card stack" style="gap:8px"><h3>Backup</h3><p class="tiny muted" style="margin:0">Everything lives on this phone. Export a backup now and then so you can't lose it.${SET.lastExport?` Last export: ${fmtD(SET.lastExport)}.`:""}</p>

function addSportSheet(){
 const have=sportIds();
 sheet(`<div class="stack"><div class="between"><h2>Add a sport</h2><button class="btn sm ghost" data-act="close" type="button">Close</button></div>
 ${Object.entries(GROUPS).map(([g,G])=>{const xs=SPORTS.filter(s=>s.g===g&&!have.includes(s.id));if(!xs.length)return"";return `<div class="stack" style="gap:6px"><span class="eyebrow">${esc(G.label)}</span><div class="optrow">${xs.map(s=>`<button type="button" class="opt" data-act="doaddsport" data-id="${s.id}">${esc(s.n)}</button>`).join("")}</div></div>`}).join("")}</div>`);

/* ================= events ================= */
document.addEventListener("click",e=>{
 const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act;
 if(a==="scrim"&&e.target!==el)return;
 const sid=UI.sport,sp=sid&&S.sports[sid];
 switch(a){
  case"nav":UI.tab=el.dataset.tab;if(el.dataset.sub2){if(UI.tab==="progress")UI.prog=el.dataset.sub2;if(UI.tab==="train")UI.train=el.dataset.sub2}render();scrollTo(0,0);break;
  case"sub":UI[el.dataset.k]=el.dataset.v;if(["train","fuel"].includes(el.dataset.k))UI.tab=el.dataset.k;if(el.dataset.k==="prog")UI.tab="progress";render();break;
  case"toggleopen":UI.open[el.dataset.n]=!UI.open[el.dataset.n];render();break;
  case"profile":sheet(vProfile());break;
  case"coach":sheet(vCoach());break;
  case"ask":ask(el.dataset.q);break;
  case"close":case"scrim":closeSheet();break;
  case"closefull":closeFull();break;
  case"aistop":if(AICTL)AICTL.abort();break;
  case"settings":sheet(vSettings());break;
  case"savekey":{const v=($("#set_key")||{}).value||"";SET.apiKey=v.trim();saveSet();render();sheet(vSettings());toast(SET.apiKey?"Key saved on this phone":"Key removed");break}
  case"testkey":{const o=$("#testout");const v=($("#set_key")||{}).value||"";if(v.trim()!==SET.apiKey){SET.apiKey=v.trim();saveSet();render()}o.textContent="Testing…";claudeCall("Reply with the single word: ready",{maxTokens:10}).then(()=>{o.textContent="✓ Connected to "+(MODELS.find(m=>m[0]===SET.model)||[0,SET.model])[1].split(" ·")[0]}).catch(e=>{o.textContent=e.message||"Failed"});break}
  case"settheme":SET.theme=el.dataset.v;saveSet();applyTheme();sheet(vSettings());break;
  case"export":exportBackup();break;
  case"askstartover":$("#confirmzone").innerHTML=`<div class="card soft stack" style="gap:8px"><span class="small">Redo sign-up? Your current data is replaced when you finish. Export a backup first if you want to keep it.</span><button class="btn sm primary" data-act="onboard" type="button">Yes, start sign-up</button></div>`;break;
  case"askexample":$("#confirmzone").innerHTML=`<div class="card soft stack" style="gap:8px"><span class="small">Replace everything with example data? This can't be undone without a backup.</span><button class="btn sm primary" data-act="reset" type="button">Yes, load example</button></div>`;break;
  case"reset":S=willSeed();save();UI.sport=null;closeSheet();render();toast("Example data loaded");break;
  case"onboard":closeSheet();startOnboarding(false);break;
  case"airetry":if(LASTAI)runAI(LASTAI);break;
  case"aifallback":if(LASTAI){const out=$("#aiout");out.innerHTML=`<div class="card soft small">Example only, not written from your data.</div>`+LASTAI.render(LASTAI.fallback(),true)}break;
  /* workout */
  case"start":startWorkout(+el.dataset.day);break;
  case"setdone":{const ei=+el.dataset.e,s=ACTIVE.ex[ei].sets[+el.dataset.s];s.done=!s.done;renderActive();if(s.done)startRest(ei);break}
  case"worktimer":{const ei=+el.dataset.e,si=+el.dataset.s,ex=ACTIVE.ex[ei];if(ex.sets[si].done)break;TIMER={kind:"work",end:Date.now()+ex.timed*1000,total:ex.timed,label:"Work · "+ex.n,next:`Rest ${ex.rest}`,e:ei,s:si};renderTimer();break}
  case"tadj":if(TIMER){TIMER.end+=(+el.dataset.v)*1000;TIMER.total=Math.max(1,TIMER.total+(+el.dataset.v));tickClock()}break;
  case"tskip":TIMER=null;renderTimer();break;
  case"addset":{const ex=ACTIVE.ex[+el.dataset.e];const l=ex.sets[ex.sets.length-1]||{kg:"",reps:""};ex.sets.push({kg:l.kg,reps:l.reps,done:false});renderActive();break}
  case"wdone":ACTIVE.wDone=!ACTIVE.wDone;renderActive();break;
  case"fdone":ACTIVE.fDone=!ACTIVE.fDone;renderActive();break;
  case"swap":{const ei=+el.dataset.e,ex=ACTIVE.ex[ei];sheet(`<div class="stack"><div><span class="eyebrow">Swap</span><h2>${esc(ex.n)}</h2></div><div class="card list">${swapsFor(ex.n).map(n=>`<button type="button" class="li" data-act="doswap" data-e="${ei}" data-n="${esc(n)}" style="background:none;border-left:none;border-right:none;border-bottom:none;width:100%;text-align:left;color:inherit"><span class="grow small"><b>${esc(n)}</b></span>${best(n)?`<span class="pill pb">PB ${Math.round(best(n).e)}</span>`:""}<span aria-hidden="true">›</span></button>`).join("")}</div><button class="btn ghost block" data-act="close" type="button">Keep ${esc(ex.n)}</button></div>`);break}
  case"doswap":{const ex=ACTIVE.ex[+el.dataset.e];ex.n=el.dataset.n;const l=lastOf(ex.n);ex.sets.forEach(s=>{if(!s.done)s.kg=l?l.kg:""});closeSheet();renderActive();toast("Swapped to "+ex.n);break}
  case"cancelwo":ACTIVE=null;TIMER=null;clearInterval(TICK);wake(false);renderTimer();closeFull();break;
  case"finishwo":finishWorkout();break;
  case"nextweek":{const P=S.programme;P.week=P.week>=P.weeks?1:P.week+1;save();render();break}
  case"buildworkout":sheet(`<div class="stack"><h2>One-off workout</h2><p class="sub small">Quick sessions you can start right now.</p>${[["Grip & pull · 30 min",[["Weighted pull-up",4,"5","2min","Full hang"],["Dead hang",3,"40s","60s","Towel if you can"],["Farmer carry",4,"40m","60s","Tall posture"]]],["Engine · 20 min",[["Bike sprints",8,"20s","100s","All-out"],["Burpees",4,"12","45s","Chest to floor"]]],["Hotel room · 25 min",[["Push-up",4,"15","60s","Full range"],["Bulgarian split squat",3,"12","60s","Per leg"],["Plank",3,"45s","30s","Squeeze glutes"]]]].map((w,i)=>`<button type="button" class="card" data-act="oneoff" data-i="${i}"><b>${w[0]}</b><div class="tiny muted">${w[1].map(x=>x[0]).join(" · ")}</div></button>`).join("")}</div>`);break;
  case"oneoff":{const W=[["Grip & pull",[["Weighted pull-up",4,"5","2min","Full hang"],["Dead hang",3,"40s","60s","Towel if you can"],["Farmer carry",4,"40m","60s","Tall posture"]]],["Engine",[["Bike sprints",8,"20s","100s","All-out"],["Burpees",4,"12","45s","Chest to floor"]]],["Hotel room",[["Push-up",4,"15","60s","Full range"],["Bulgarian split squat",3,"12","60s","Per leg"],["Plank",3,"45s","30s","Squeeze glutes"]]]][+el.dataset.i];closeSheet();startWorkout(null,{title:W[0],ex:W[1].map(([n,s,r,rest,cue])=>({n,s,r,rest,cue}))});break}
  /* TLA / ELA */
  case"tlacat":UI.tlaCat=el.dataset.v;render();break;
  case"tla":tlaConfigure(el.dataset.id);break;
  case"useprog":S.programme=TMP.prog;save();closeFull();UI.tab="train";UI.train="plan";render();toast("Programme set");break;
  case"ela":closeFull();elaConfigure(el.dataset.id);break;
  case"usemeals":S.mealPlan=TMP.meals;if(TMP.meals.macros.kcal){S.targets.train={...TMP.meals.macros};S.targets.rest={kcal:TMP.meals.macros.kcal-280,p:TMP.meals.macros.p,c:Math.max(0,TMP.meals.macros.c-70),f:TMP.meals.macros.f}}save();closeFull();UI.tab="fuel";UI.fuel="plan";render();toast("Meal plan set");break;
  case"logmeal":{const m=S.mealPlan.days[+el.dataset.d].meals[+el.dataset.m];(S.meals[TD]=S.meals[TD]||[]).push({n:m.n,slot:["Breakfast","Lunch","Snack","Dinner"].includes(m.slot)?m.slot:"Snack",kcal:m.kcal,p:m.p,c:m.c,f:m.f});save();toast("Logged to today");break}
  case"copyshop":{const txt=S.mealPlan.shopping.map(g=>g.cat+": "+g.items.join(", ")).join("\n");try{navigator.clipboard.writeText(txt).then(()=>toast("Copied"),()=>toast("Copy blocked here"))}catch(err){toast("Copy blocked here")}break}
  /* option pickers inside sheets */
  case"pick1":{const g=el.closest("[data-group]");g.querySelectorAll(".opt").forEach(b=>b.classList.toggle("on",b===el));break}
  case"pickm":el.classList.toggle("on");break;
  /* fuel */
  case"supp":{const i=+el.dataset.i;S.suppLog[TD]=S.suppLog[TD]||{};S.suppLog[TD][i]=!S.suppLog[TD][i];save();render();break}
  case"delsupp":S.supps.splice(+el.dataset.i,1);S.suppLog={};save();render();break;
  case"daytype":S.dayType=el.dataset.v;save();render();break;
  case"water":S.water[TD]=Math.max(0,(S.water[TD]||0)+(+el.dataset.v));save();render();break;
  case"delmeal":S.meals[TD].splice(+el.dataset.i,1);save();render();break;
  case"addfood":formSheet("Add food","food",`${fieldH("fn","Food","required placeholder=\"e.g. Salmon, potatoes, greens\"")}${selectH("fslot","Meal",["Breakfast","Lunch","Snack","Dinner"],el.dataset.slot||"Dinner")}<div class="fgrid">${fieldH("fk","kcal",'inputmode="numeric" required')}${fieldH("fp","Protein g",'inputmode="numeric"')}${fieldH("fc","Carbs g",'inputmode="numeric"')}${fieldH("ff","Fat g",'inputmode="numeric"')}</div><p class="tiny muted" style="margin:0">The real app adds barcode scan and photo recognition here.</p>`,"Add");break;
  case"addsupp":formSheet("Add supplement","supp",`${selectH("sn","Supplement",[...SUPP_LIB,"Other"],"Creatine monohydrate")}${fieldH("so","If other, name it","")}${fieldH("sd","Dose","placeholder=\"e.g. 3 g\"")}${selectH("st","When",["Morning","Any time","With food","Pre-training","Evening"],"Morning")}`);break;
  case"suppreview":runAI({title:"Stack review",eyebrow:"Supplements",json:false,tier:"default",prompt:`Review this athlete's supplement stack. Athlete: ${ctx()}\nStack: ${S.supps.map(s=>`${s.n} ${s.dose} (${s.time})`).join("; ")}.\nIn plain text (no markdown headers), under 200 words: what's well-supported, what has thin evidence, timing tweaks, anything worth adding for their goals, and any interactions to check with a GP. Not medical advice.`,fallback:()=>"Creatine, vitamin D, magnesium and omega-3 are well-supported basics. Anything with thinner evidence is worth testing with bloods before and after 8–12 weeks. Check with a GP before adding anything new.",render:t=>`<div class="card prose">${esc(t)}</div>`});break;
  /* body */
  case"addweight":formSheet("Weigh in","weight",`${fieldH("wkg","Weight (kg)",'inputmode="decimal" required',latestW()?latestW().kg:"")}${fieldH("wd","Date",'type="date" required',TD)}<p class="tiny muted" style="margin:0">Same time each day, ideally first thing in the morning.</p>`);break;
  case"addpb":{const names=[...new Set([...Object.keys(S.lifts),...Object.values(EX).flat()])].sort();formSheet("Log a lift","pb",`${selectH("pbn","Exercise",[...names,"Other"],UI.pbLast||names[0])}${fieldH("pbo","If other, name it","")}<div class="fgrid">${fieldH("pbkg","Weight (kg)",'inputmode="decimal" required')}${fieldH("pbr","Reps",'inputmode="numeric" required',"1")}</div>${fieldH("pbd","Date",'type="date" required',TD)}<label class="row small" for="pbt" style="font-weight:600"><input type="checkbox" id="pbt" name="pbt"> Tested max (a true 1RM attempt)</label><p class="tiny muted" style="margin:0">Use this for past PBs or lifts done outside a workout.</p>`);break}
  case"addbench":formSheet("Add benchmark","bench",`${fieldH("bn","Test","required placeholder=\"e.g. 5 km run\"")}${fieldH("bv","Result","required placeholder=\"e.g. 22:40\"")}`);break;
  /* goals */
  case"goalnew":goalNew();break;
  case"planfor":{const g=S.goals[+el.dataset.i];goalNew(g.n+(g.metric?". "+g.metric:""));break}
  case"savegoal":{const G=TMP.goal;const r=G.res;S.goals.unshift({id:"g"+Date.now(),n:r.title||G.text,type:r.type||"Goal",target:G.date||"",metric:"",prog:0,plan:r,applied:G.applied||{}});save();closeFull();UI.tab="progress";UI.prog="goals";render();toast("Goal saved");break}
  case"applypart":{if(el.dataset.gi!=null){const g=S.goals[+el.dataset.gi];applyPart(el.dataset.k,g.plan,g);openFull(`<div class="app stack"><div class="top"><button class="btn sm ghost" data-act="closefull" type="button">Close</button><span class="eyebrow">Goal plan</span><span style="width:52px"></span></div>${goalPreview(g.plan,true,+el.dataset.gi)}</div>`)}else{TMP.goal.applied=TMP.goal.applied||{};applyPart(el.dataset.k,TMP.goal.res,null);TMP.goal.applied[el.dataset.k]=true;el.textContent="Applied ✓";el.classList.remove("primary")}break}
  case"viewgoal":{const gi=+el.dataset.i;openFull(`<div class="app stack"><div class="top"><button class="btn sm ghost" data-act="closefull" type="button">Close</button><span class="eyebrow">Goal plan</span><span style="width:52px"></span></div>${goalPreview(S.goals[gi].plan,true,gi)}</div>`);break}
  case"delgoal":S.goals.splice(+el.dataset.i,1);save();render();break;
  case"gosport":UI.tab="sport";UI.sport=el.dataset.id;UI.sportView="road";render();scrollTo(0,0);break;
  /* sport */
  case"pickSport":UI.sport=el.dataset.id;render();break;
  case"addsport":addSportSheet();break;
  case"doaddsport":{const id=el.dataset.id;S.sports[id]={step:0,sub:0,start:TD,base:0,skills:[],focus:[],log:[],checks:{},ai:{}};save();UI.sport=id;UI.tab="sport";UI.sportView="road";closeSheet();render();toast(sportDef(id).n+" added");break}
  case"rmsport":delete S.sports[el.dataset.id];Object.values(S.programme?.days||{}).forEach(d=>{if(d.sport===el.dataset.id){d.type="rest";d.title="Rest";d.sub="Recovery";delete d.sport}});save();sheet(vProfile());render();break;
  case"logsport":logSportForm(el.dataset.id);break;
  case"setlevel":{const d=sportDef(sid);formSheet(`Your ${d.n} level`,"level",`${selectH("lv",d.kind==="belts"?"Belt":"Level",d.steps,d.steps[sp.step])}${d.stripes?selectH("lvs","Stripes",["0","1","2","3","4"],String(sp.sub)):""}${fieldH("lvst","Started",'type="date"',sp.start)}`);break}
  case"lvl":{const t=sp.skills[+el.dataset.i];t.l=(t.l+1)%3;save();render();break}
  case"check":sp.checks[el.dataset.k]=!sp.checks[el.dataset.k];save();render();break;
  case"addskill":{const d=sportDef(sid);const have=sp.skills.map(s=>s.n);const lib=d.skills.filter(s=>!have.includes(s[0]));
   formSheet(`Add to ${grp(d).skillWord==="Arsenal"?"arsenal":"skills"}`,"skill",`${lib.length?selectH("skn","From the "+d.n+" library",["",...lib.map(s=>s[0])],""):""}${fieldH("skc","Or type your own","placeholder=\"e.g. Arm-in guillotine\"")}${selectH("skl","How well do you know it?",levelsOf(d),levelsOf(d)[0])}`);break}
  case"addfocus":{const d=sportDef(sid);formSheet("New focus","focus",`${fieldH("fon","What are you working on?","required placeholder=\"e.g. "+esc(d.skills[d.skills.length-1][1])+"\"")}${fieldH("fow","Why","placeholder=\"What keeps going wrong?\"")}${fieldH("fot","Linked skills","placeholder=\"Comma separated\"")}`);break}
  case"delfocus":sp.focus.splice(+el.dataset.i,1);save();render();break;
  case"drills":{const d=sportDef(sid),f=sp.focus[+el.dataset.i];runAI({title:f.n,eyebrow:`${d.n} · drill plan`,json:false,prompt:`You are an experienced ${d.n} coach. Write a practical 2-week drill plan for this focus: "${f.n}" (why: ${f.why||"n/a"}; linked skills: ${(f.tech||[]).join(", ")||"n/a"}).\nAthlete: ${ctx()}\nPlain text, no markdown headers. Include: what to drill before/after sessions (reps or minutes), positional or situational practice, one thing to try in live ${liveOf(d).toLowerCase()}, and how to know it's working. Under 220 words.`,fallback:()=>`Before each session (10 min): solo or partner reps of the entry into ${f.n.toLowerCase()}, 3 × 10 each side.\n\nPositional work (3 × 3 min): start in the position, reset on success or failure.\n\nLive: give yourself one goal per round, e.g. attempt the entry once.\n\nAfter: note what worked and where it broke down. After 2 weeks, move the linked skills up a level if they're landing.`,render:t=>`<div class="card prose">${esc(t)}</div>`})}break;
  case"aichecklist":{const d=sportDef(sid),i=+el.dataset.i;
   if(checklistFor(sid,i)&&!el.dataset.force&&el.dataset.n){UI.open[el.dataset.n]=!UI.open[el.dataset.n];render();break}
   const skills=sp.skills.map(s=>s.n).join(", ");
   runAI({title:`${d.steps[i]}`,eyebrow:`${d.n} · what's expected`,tier:"default",prompt:`List what's typically expected to reach "${d.steps[i]}" in ${d.n} (coming from "${d.steps[Math.max(0,i-1)]}"). UK context where relevant. Athlete's current skills: ${skills||"none logged"}.\nReply with ONLY a JSON array: [{"group":"short group name","items":[{"label":"short requirement","skill":"matching skill name from this list if one fits, else empty: ${d.skills.map(s=>s[0]).join(", ")}"}]}]. 4–7 groups, 2–5 items each.`,
    fallback:()=>{const cats=[...new Set(d.skills.map(s=>s[1]))];return cats.map(c=>({group:c,items:d.skills.filter(s=>s[1]===c).slice(0,4).map(s=>({label:s[0],skill:s[0]}))}))},
    render:(res,off)=>{const groups=(Array.isArray(res)?res:[]).map((g,gi)=>({g:String(g.group||"Group"),items:(g.items||[]).map((it,ii)=>{const lab=typeof it==="string"?it:String(it.label||"");const skl=typeof it==="string"?"":String(it.skill||"");return[`ai-${i}-${gi}-${ii}`,lab,skl&&d.skills.some(s=>s[0].toLowerCase()===skl.toLowerCase())?skl:""]})}));
     sp.ai[i]=groups;save();render();return `<div class="card stack">${vChecklist(sid,{src:"ai",groups},i).replace(/data-act="aichecklist"[^>]*>↻ Rebuild<\/button>/,'data-act="closefull">Done</button>')}</div><p class="tiny muted" style="margin:0">Saved to your roadmap. Tick items as your coach signs them off.</p><button class="btn primary block" data-act="closefull" type="button">Back to roadmap</button>`}});break}
  /* onboarding */
  case"obclose":OB=null;closeFull();break;
  case"obpick":{const g=el.dataset.g,v=isNaN(+el.dataset.v)||g==="age"?el.dataset.v:(["days","len"].includes(g)?+el.dataset.v:el.dataset.v);if(el.dataset.m){const arr=OB[g];const k=arr.indexOf(v);k>=0?arr.splice(k,1):arr.push(v)}else OB[g]=v;renderOB();break}
  case"obnone":OB.none=!OB.none;if(OB.none)OB.sportsSel=[];renderOB();break;
  case"obsport":{const id=el.dataset.id,k=OB.sportsSel.indexOf(id);k>=0?OB.sportsSel.splice(k,1):OB.sportsSel.push(id);OB.none=false;el.classList.toggle("on",k<0);const n=$("[data-act=obnone]");if(n)n.classList.remove("on");break}
  case"oblv":OB.sportLv[el.dataset.id].step=+el.dataset.v;renderOB();break;
  case"obsub":OB.sportLv[el.dataset.id].sub=+el.dataset.v;renderOB();break;
  case"obback":OB.i=Math.max(0,OB.i-1);renderOB();break;
  case"obnext":if(OB.i===0&&!OB.name.trim()){toast("Add your first name");break}if(OB.i===3&&!OB.sportsSel.length&&!OB.none){toast("Pick a sport or choose 'just train'");break}if(OB.i===3&&!OB.sportsSel.length){OB.i=5}else if(OB.i<OB_STEPS.length-1)OB.i++;else{finishOB();break}renderOB();$("#fullin").scrollTo(0,0);break;
 }
});
document.addEventListener("input",e=>{const t=e.target;
 if(ACTIVE&&t.dataset&&t.dataset.f){ACTIVE.ex[+t.dataset.e].sets[+t.dataset.s][t.dataset.f]=t.value}
 if(OB&&t.dataset.ob){OB[t.dataset.ob]=t.value;if(t.dataset.ob==="q"){$("#obsports").innerHTML=obSportList(t.value.toLowerCase())}}
 if(t.dataset&&t.dataset.setkey){SET.apiKey=t.value.trim();saveSet()}
 if(OB&&t.dataset.obst){OB.sportLv[t.dataset.obst].start=t.value?t.value+"-01":""}
});
document.addEventListener("submit",e=>{
 const f=e.target;if(!f.dataset.form)return;e.preventDefault();const v=Object.fromEntries(new FormData(f));
 const picked=(g)=>[...f.querySelectorAll(`[data-group="${g}"] .opt.on`)].map(b=>b.dataset.v);
 const sp=UI.sport&&S.sports[UI.sport];
 switch(f.dataset.form){
  case"chat":f.reset();ask(v.chatq||"");return;
  case"tla":{const cfg={days:+(picked("days")[0]||S.profile.days),len:+(picked("len")[0]||S.profile.len),equip:picked("equip"),goal:v.tlagoal||""};closeSheet();tlaRun(f.dataset.id,cfg);return}
  case"ela":{const cfg={kcal:+v.elakcal||S.targets.train.kcal,aim:picked("aim")[0]||"Perform",diet:picked("diet")};closeSheet();elaRun(f.dataset.id,cfg);return}
  case"goal":{const parts=picked("parts");if(!parts.length){toast("Pick at least one part");return}closeSheet();goalRun(v.gtext,parts,v.gdate||"",null);return}
  case"food":(S.meals[TD]=S.meals[TD]||[]).push({n:v.fn,slot:v.fslot,kcal:+v.fk||0,p:+v.fp||0,c:+v.fc||0,f:+v.ff||0});toast("Added to "+v.fslot.toLowerCase());break;
  case"weight":{const kg=parseFloat(v.wkg);if(isNaN(kg))return;S.weights=S.weights.filter(w=>w.d!==v.wd);S.weights.push({d:v.wd,kg:r1(kg)});S.weights.sort((a,b)=>a.d<b.d?-1:1);toast("Weigh-in saved");break}
  case"pb":{const n=v.pbn==="Other"?(v.pbo||"").trim():v.pbn;const kg=parseFloat(v.pbkg),r=parseInt(v.pbr);if(!n||isNaN(kg)||!r){toast("Add an exercise, weight and reps");return}UI.pbLast=n;const before=(S.lifts[n]||[]).slice();const k=pbKinds(before,kg,r);(S.lifts[n]=S.lifts[n]||[]).push({d:v.pbd||TD,kg,reps:r,t:v.pbt&&r===1?1:0});S.lifts[n].sort((a,b)=>a.d<b.d?-1:1);UI.open["pb:"+n]=true;toast(k[0]==="First entry"?`${n} added`:k.length?`PB · ${fmtKinds(k)}`:"Lift saved");break}
  case"bench":S.bench.unshift({n:v.bn,v:v.bv,d:TD});toast("Benchmark added");break;
  case"supp":{const n=v.sn==="Other"?(v.so||"").trim():v.sn;if(!n)return;S.supps.push({n,dose:v.sd||"",time:v.st,why:"Added by you. Tap AI review to check it against your stack."});toast("Supplement added");break}
  case"slog":{const s=S.sports[v.sid];s.log.push({d:v.ldate||TD,type:v.ltype,mins:+v.lmins||0,live:+v.llive||0,dist:+v.ldist||0,rpe:v.lrpe||"",grade:v.lgrade||"",top:v.ltop||"",result:v.lres||"",worked:v.lworked||"",notes:v.lnotes||""});s.log.sort((a,b)=>a.d<b.d?-1:1);toast(`Logged · ${sHours(v.sid)} hrs total`);break}
  case"level":{const d=sportDef(UI.sport);sp.step=Math.max(0,d.steps.indexOf(v.lv));if(v.lvs!=null)sp.sub=+v.lvs;if(v.lvst)sp.start=v.lvst;toast("Level updated");break}
  case"skill":{const d=sportDef(UI.sport);const n=(v.skc||"").trim()||v.skn;if(!n)return;const c=(d.skills.find(s=>s[0]===n)||[0,"Other"])[1];sp.skills.push({n,c,l:levelsOf(d).indexOf(v.skl)});toast("Added");break}
  case"focus":sp.focus.unshift({n:v.fon,why:v.fow||"",tech:(v.fot||"").split(",").map(s=>s.trim()).filter(Boolean),start:TD});toast("Focus added");break;
 }
 save();closeSheet();render();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#layer .scrim"))closeSheet()}});
function exportBackup(){
 const blob=new Blob([JSON.stringify({app:"apex-athlete",exported:new Date().toISOString(),state:S},null,1)],{type:"application/json"});
 const name=`apex-athlete-backup-${TD}.json`;
 const done=()=>{SET.lastExport=TD;saveSet();toast("Backup exported")};
 try{const file=new File([blob],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"Apex Athlete backup"}).then(done).catch(()=>{});return}}catch(e){}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);done();
}
document.addEventListener("change",e=>{const t=e.target;
 if(t.id==="importfile"&&t.files&&t.files[0]){const fr=new FileReader();fr.onload=()=>{try{const j=JSON.parse(fr.result);const st=j.state||j;if(!st.profile||!st.targets)throw 0;S=st;save();closeSheet();UI.sport=null;render();toast("Backup restored")}catch(err){toast("That file isn't an Apex Athlete backup")}};fr.readAsText(t.files[0])}
 if(t.dataset&&t.dataset.setsel){SET[t.dataset.setsel]=t.value;saveSet()}
});
async function boot(){
 await DB.open();
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 const rs=(await DB.get("settings"))||lsGet(KEY+":set");if(rs){try{Object.assign(SET,JSON.parse(rs))}catch(e){}}
 applyTheme();
 const raw=(await DB.get("state"))||lsGet(KEY);if(raw){try{S=JSON.parse(raw)}catch(e){S=null}}
 if(!S){S=willSeed();render();startOnboarding(true)}else render();
}
boot();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>
